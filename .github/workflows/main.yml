name: Load Test

on:
  push:
    branches: [ "main" ]

jobs:
  load_test:
    runs-on: ubuntu-latest

    # Задаем рабочую папку для ВСЕХ шагов внутри этого job
    defaults:
      run:
        working-directory: lab4mazhenovtest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Flask app
        run: python app.py &

      - name: Run locust load test
        run: |
          locust -f locustfile.py --headless -u 10 -r 2 --run-time 30s --html report.html
